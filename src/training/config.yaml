data:
  raw_path: data/raw/devices.json
  val_split: 0.2
  model_holdout: 0.2
  seed: 2026

model:
  embedding_dims:
    category: 3
    manufacturer: 5
    model: 12
    climateZone: 3
  hidden_layers: [64, 32]
  bundle_dir: checkpoints/serving

training:
  batch_size: 64
  epochs: 150
  learning_rate: 0.001
  unk_mask_prob: 0.05
